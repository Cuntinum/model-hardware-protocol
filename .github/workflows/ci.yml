name: KHP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -e sdk/python/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=khp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  typescript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install

      - name: Type check
        working-directory: sdk/typescript
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: Lint Python SDK
        run: ruff check sdk/python/ --ignore F401,E402

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install -e sdk/python/

      - name: Validate example manifests
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'drivers/docker-sim')
          from driver import SimulatedThermocycler, SimulatedLiquidHandler, SimulatedRoboticArm
          for cls in [SimulatedThermocycler, SimulatedLiquidHandler, SimulatedRoboticArm]:
              d = cls()
              m = d.get_manifest()
              assert m['device_id'], f'{cls.__name__} missing device_id'
              assert m['readable'], f'{cls.__name__} has no readable properties'
              print(f'✓ {cls.__name__}: {len(m[\"readable\"])} readable, {len(m[\"writable\"])} writable, {len(m[\"procedures\"])} procedures')
          print('All manifests valid.')
          "
