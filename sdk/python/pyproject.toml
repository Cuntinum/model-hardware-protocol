[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khp"
version = "0.1.0"
description = "Model Hardware Protocol — AI agents controlling physical devices"
readme = {text = "Model Hardware Protocol — The open standard for AI models to safely control physical hardware.", content-type = "text/plain"}
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Cuntinum", email = "dev@cuntinum.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
keywords = ["hardware", "protocol", "ai", "agents", "mcp", "iot", "automation"]

[project.urls]
Homepage = "https://github.com/Cuntinum/model-hardware-protocol"
Documentation = "https://khp.dev"
Repository = "https://github.com/Cuntinum/model-hardware-protocol"
Issues = "https://github.com/Cuntinum/model-hardware-protocol/issues"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
gpio = ["RPi.GPIO>=0.7", "smbus2>=0.4", "spidev>=3.6"]
camera = ["opencv-python>=4.8"]
mqtt = ["paho-mqtt>=1.6"]
modbus = ["pymodbus>=3.5"]
visa = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
rest = ["httpx>=0.25", "requests>=2.31"]
mcp = ["mcp>=0.1"]
cli = ["click>=8.1", "rich>=13.0"]
discovery = ["zeroconf>=0.80"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "pytest-cov>=4.1", "ruff>=0.1"]
all = [
    "pyserial>=3.5",
    "opencv-python>=4.8",
    "paho-mqtt>=1.6",
    "pymodbus>=3.5",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "httpx>=0.25",
    "requests>=2.31",
    "click>=8.1",
    "rich>=13.0",
    "zeroconf>=0.80",
]

[project.scripts]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
